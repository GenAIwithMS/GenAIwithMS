<svg width="900" height="56" viewBox="0 0 900 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'Courier New', Consolas, monospace; }
    </style>
    <path id="rail" d="M 20,14 H 880" fill="none"/>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ee6b0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5ee6b0"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="20" y="13" width="860" height="2" fill="url(#fade)"/>
  <circle r="3" fill="#5ee6b0">
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion>
  </circle>
  <circle r="2.4" fill="#79c0ff">
    <animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion>
  </circle>
  <text x="450" y="42" text-anchor="middle" class="mono" font-size="13" fill="#6e7681">$ <tspan fill="#c9d1d9">exit 0</tspan>  <tspan fill="#6e7681"># thanks for stopping by</tspan><tspan fill="#5ee6b0"> ▍</tspan></text>
</svg>
