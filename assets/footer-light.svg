<svg width="900" height="56" viewBox="0 0 900 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'Courier New', Consolas, monospace; }
    </style>
    <path id="rail" d="M 20,14 H 880" fill="none"/>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#8250df" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="20" y="13" width="860" height="2" fill="url(#fade)"/>
  <circle r="3" fill="#0969da">
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion>
  </circle>
  <circle r="2.4" fill="#8250df">
    <animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion>
  </circle>
  <text x="450" y="42" text-anchor="middle" class="mono" font-size="13" fill="#57606a">$ <tspan fill="#24292f">exit 0</tspan>  <tspan fill="#57606a"># thanks for stopping by</tspan><tspan fill="#0969da"> ▍</tspan></text>
</svg>
